<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account Status</title>
    <link rel="icon" href="https://community.azion.app/kit/v1/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://community.azion.app/kit/v1/azion-community.css" />
    <link rel="stylesheet" href="/app.css" />
    <script src="https://community.azion.app/kit/v1/azion-community.js"></script>
    <script src="/app.js" defer></script>
  </head>
  <body data-app-name="Account Status">
    <main class="azc-main">
      <div class="azc-page-heading">
        <div class="azc-page-heading__text">
          <nav aria-label="Breadcrumb">
            <ol class="azc-breadcrumb">
              <li>Account<span class="azc-mono" id="crumbClient"></span></li>
              <li>Status</li>
            </ol>
          </nav>
          <h1>Service status</h1>
          <p class="azc-description">Health of every application in your account, aggregated across all domains.</p>
        </div>
        <div class="azc-page-heading__actions">
          <div class="azc-segmented" role="group" aria-label="Time range">
            <button type="button" class="azc-mono" data-range="1h" aria-pressed="true">1h</button>
            <button type="button" class="azc-mono" data-range="24h" aria-pressed="false">24h</button>
            <button type="button" class="azc-mono" data-range="7d" aria-pressed="false">7d</button>
          </div>
          <button type="button" class="azc-btn azc-btn--secondary azc-btn--outlined azc-btn--small azc-btn--icon" id="refreshBtn" aria-label="Refresh" title="Refresh">
            <svg class="azc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5" /></svg>
          </button>
        </div>
      </div>

      <div id="platformAlert" class="platform-alert" aria-live="polite" hidden></div>

      <section class="group" aria-labelledby="platformTitle">
        <div class="group-head">
          <h2 id="platformTitle">Azion platform</h2>
          <span class="azc-tag" id="platformTag">Loading</span>
          <a class="group-link" href="https://status.azion.com" target="_blank" rel="noopener">
            status.azion.com
            <svg class="azc-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /></svg>
          </a>
        </div>
        <div class="azc-card" id="platformHistory"></div>
      </section>

      <section class="banner" id="banner" data-status="loading" aria-live="polite">
        <span class="banner-icon" id="bannerIcon"></span>
        <div>
          <div class="banner-title" id="bannerTitle">Checking your services</div>
          <div class="azc-meta" id="bannerSub">Loading metrics</div>
        </div>
      </section>

      <div id="groups"></div>
    </main>

    <div class="day-tip" id="dayTip" role="tooltip" hidden></div>
  </body>
</html>
